name: C2Ledger Kaggle Publish

on:
  push:
    branches: [main, c2ledger-v1-hardening]
    paths:
      - ".github/workflows/c2ledger-kaggle-publish.yml"
  workflow_dispatch:

jobs:
  publish-kaggle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require Kaggle credentials
        run: |
          if [ -n "$KAGGLE_API_TOKEN" ]; then
            echo "Kaggle modern API token detected"
          else
            test -n "$KAGGLE_USERNAME"
            test -n "$KAGGLE_KEY"
            echo "Kaggle legacy credentials detected"
          fi
      - name: Install official Kaggle tooling
        run: python3 -m pip install --disable-pip-version-check kaggle kagglehub
      - name: Resolve authenticated Kaggle username
        run: |
          if [ -n "$KAGGLE_API_TOKEN" ]; then
            python3 - <<'PY'
            import os, kagglehub
            username=kagglehub.whoami()["username"]
            if not username:
                raise SystemExit("Kaggle token authenticated but username could not be resolved")
            with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as f:
                f.write("KAGGLE_USERNAME="+username+"\n")
            print("Authenticated Kaggle user:", username)
            PY
          else
            echo "Using legacy Kaggle username from secret"
          fi
      - name: Prepare private no-internet kernel metadata
        run: |
          python3 c2ledger/kaggle/prepare_kernel.py
          python3 - <<'PY'
          import json
          x=json.load(open("c2ledger/kaggle/kernel-metadata.json"))
          assert x["is_private"] is True
          assert x["enable_internet"] is False
          assert x["enable_gpu"] is False
          assert x["kernel_type"]=="script"
          PY
      - name: Push and run Kaggle kernel
        run: kaggle kernels push -p c2ledger/kaggle --timeout 1800
      - name: Wait for real Kaggle completion
        run: |
          slug="$KAGGLE_USERNAME/c2ledger-kaggle-replay"
          for i in $(seq 1 60); do
            out=$(kaggle kernels status "$slug" 2>&1 || true)
            echo "$out"
            echo "$out" | grep -qi 'complete' && break
            echo "$out" | grep -Eqi 'error|cancel' && exit 1
            sleep 15
          done
          out=$(kaggle kernels status "$slug" 2>&1)
          echo "$out" | grep -qi 'complete'
      - name: Download and verify Kaggle output evidence
        run: |
          mkdir -p artifacts/kaggle-remote
          kaggle kernels output "$KAGGLE_USERNAME/c2ledger-kaggle-replay" -p artifacts/kaggle-remote --force
          test -f artifacts/kaggle-remote/campaign.json
          python3 - <<'PY'
          import json
          x=json.load(open('artifacts/kaggle-remote/campaign.json'))
          assert x['schema']=='c2ledger-kaggle-replay/v1'
          assert x['digest'].startswith('sha256:')
          print(json.dumps({'status':'PASS','execution':'KAGGLE_REMOTE','digest':x['digest']}))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kaggle-remote-evidence
          path: artifacts/kaggle-remote/
